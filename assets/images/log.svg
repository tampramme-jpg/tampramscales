<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tpsGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#44bb00"/>
      <stop offset="100%" stop-color="#66FF00"/>
    </linearGradient>
    <linearGradient id="tpsSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <g transform="translate(10, 5)">
    <!-- Digital Matrix Pixels -->
    <rect x="58" y="6" width="16" height="16" fill="url(#tpsGreenGrad)" rx="2"/>
    <rect x="78" y="24" width="14" height="14" fill="url(#tpsGreenGrad)" rx="2"/>
    <rect x="38" y="22" width="15" height="15" fill="url(#tpsGreenGrad)" rx="2"/>
    <rect x="20" y="38" width="14" height="14" fill="url(#tpsGreenGrad)" rx="2"/>
    <rect x="20" y="56" width="14" height="14" fill="url(#tpsGreenGrad)" rx="2"/>
    <rect x="10" y="72" width="15" height="15" fill="url(#tpsGreenGrad)" rx="2"/>
    
    <!-- Stylized Metallic T & S Graphic -->
    <path d="M15 44 L92 44 L92 58 L63 58 L63 94 L44 94 L44 58 L15 58 Z" fill="url(#tpsSilverGrad)"/>
    <path d="M48 64 C65 60, 85 64, 88 80 C89 88, 76 96, 52 96 C42 96, 32 94, 25 90 L30 76 C36 80, 44 82, 52 82 C59 82, 65 79, 64 74 C63 70, 54 68, 44 69 Z" fill="url(#tpsGreenGrad)"/>

    <!-- Dynamic Ascending Growth Arrow -->
    <path d="M18 102 C50 98, 92 78, 114 26 L102 30 L126 8 L130 36 L118 39 C98 84, 52 110, 18 102 Z" fill="url(#tpsGreenGrad)" filter="url(#neonGlow)"/>
  </g>
  <!-- Brand Typography -->
  <text x="160" y="74" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1">TamPram<tspan fill="#66FF00">Scale</tspan></text>
  <text x="162" y="104" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="16" fill="#A3A3A3" letter-spacing="6">DIGITAL GROWTH AGENCY</text>
